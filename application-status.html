<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Status | CUN Demo</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="demo-banner">DEMO — Status lookup uses localStorage applications only.</div>
  <header class="site-header"><div class="container header-inner">
    <a href="index.html" class="logo-link"><img src="assets/logo.svg" alt="CUN"></a>
    <a href="apply.html" class="btn btn-accent btn-sm">Apply</a>
  </div></header>
  <main class="section"><div class="container" style="max-width:560px">
    <h1>Check Application Status</h1>
    <form id="status-form" class="card" style="padding:1.5rem">
      <div class="form-group"><label class="form-label">Application Number</label><input class="form-control" name="number" required placeholder="CUN/2026/......"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
      <button type="submit" class="btn btn-primary btn-block">Check Status</button>
    </form>
    <div id="status-result" class="mt-4" style="display:none"></div>
  </div></main>
  <script src="js/app.js"></script>
  <script src="js/application.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.getElementById("status-form").onsubmit=(e)=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      const rec=Application.findByNumberAndEmail(fd.get("number"), fd.get("email"));
      const box=document.getElementById("status-result");
      box.style.display="block";
      if(!rec){ box.innerHTML='<div class="card" style="padding:1.5rem"><p>No application found. Ensure you used the same browser where you applied, or that the number and email match.</p></div>'; return; }
      box.innerHTML=`<div class="card" style="padding:1.5rem">
        <h3>${sanitize(rec.applicationNumber)}</h3>
        <p><strong>Status:</strong> <span class="badge badge-info">${sanitize(rec.status)}</span></p>
        <p><strong>Name:</strong> ${sanitize(rec.firstName||"")} ${sanitize(rec.lastName||"")}</p>
        <p><strong>Programme:</strong> ${sanitize(rec.programme||"—")}</p>
        <p><strong>Submitted:</strong> ${formatDate(rec.submittedAt)}</p>
        <p class="text-muted mt-2">Demo statuses: received → under review → decision. Admin can change status in full production system.</p>
      </div>`;
    };
  </script>
</body>
</html>
