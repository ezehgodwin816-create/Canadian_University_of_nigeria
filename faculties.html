<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faculties | Canadian University of Nigeria</title><meta name="description" content="Explore CUN academic areas, departments and publicly reported programmes."><meta property="og:title" content="Faculties | Canadian University of Nigeria"><meta property="og:description" content="Explore CUN academic areas, departments and publicly reported programmes."><meta property="og:type" content="website"><meta property="og:url" content="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/faculties.html"><link rel="canonical" href="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/faculties.html"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a href="#main" class="skip-link">Skip to content</a><header class="site-header"><div class="container header-inner"><a href="index.html" class="logo-link"><img src="assets/logo.svg" alt="Canadian University of Nigeria"></a><nav class="main-nav"></nav><div class="header-actions"><button class="search-toggle" aria-label="Search">⌕</button><a href="login.html" class="btn btn-ghost btn-sm">Portals</a><a href="apply.html" class="btn btn-accent btn-sm">Apply Now</a><button class="menu-toggle" aria-label="Menu">☰</button></div></div></header><div class="mobile-menu"><div class="mobile-menu-panel"><div class="mobile-menu-header"><strong>Menu</strong><button class="mobile-menu-close btn btn-ghost">&times;</button></div><nav class="mobile-nav"></nav></div></div><main id="main"><div class="page-header"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Faculties</span></div><span class="section-label">Academic structure</span><h1>Faculties & Schools</h1><p>Academic areas and their publicly reported programme groupings.</p></div></div><section class="section"><div class="container" id="faculties-full" class="grid grid-2"></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom"><p>© 2026 Canadian University of Nigeria.</p><div><a href="programmes.html">Programmes</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy</a></div></div></div></footer><script src="js/data.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script><script src="js/components.js"></script><script src="js/seo.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const el=document.getElementById('faculties-full');el.className='grid grid-2';el.innerHTML=CUN_DATA.faculties.map(f=>`<article class="card"><div class="card-body"><span class="content-status">${sanitize(f.type)}</span><h2 class="mt-2">${sanitize(f.name)}</h2><p>${sanitize(f.description)}</p><h3 class="mt-3" style="font-size:1rem">Programmes</h3><ul style="padding-left:1.2rem;list-style:disc">${f.programmes.map(n=>{const p=CUN_DATA.programmes.find(x=>x.name.toLowerCase()===n.toLowerCase());return `<li><a href="programme.html?id=${p?.id||''}">${sanitize(n)}</a></li>`}).join('')}</ul><a href="programmes.html?faculty=${f.id}" class="btn btn-sm btn-outline mt-3">Explore this area</a></div></article>`).join('')});</script></body></html>
