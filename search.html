<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Canadian University of Nigeria</title><link rel="canonical" href="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/search.html"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a href="#main" class="skip-link">Skip to content</a><header class="site-header"><div class="container header-inner"><a href="index.html" class="logo-link"><img src="assets/logo.svg" alt="Canadian University of Nigeria"></a><nav class="main-nav"></nav><div class="header-actions"><a href="login.html" class="btn btn-ghost btn-sm">Portals</a><a href="apply.html" class="btn btn-accent btn-sm">Apply Now</a><button class="menu-toggle" aria-label="Menu">☰</button></div></div></header><div class="mobile-menu"><div class="mobile-menu-panel"><div class="mobile-menu-header"><strong>Menu</strong><button class="mobile-menu-close btn btn-ghost">&times;</button></div><nav class="mobile-nav"></nav></div></div><main id="main"><div class="page-header"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Search</span></div><span class="section-label">Search</span><h1>Search CUN</h1><p>Find programmes, faculties, departments, news, events and FAQs.</p></div></div><section class="section"><div class="container"><form id="search-form" class="filter-bar"><input id="q" class="form-control" type="search" required placeholder="What are you looking for?" aria-label="Search"><button class="btn btn-primary">Search</button></form><div id="results" class="mt-4"></div></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom"><p>© 2026 Canadian University of Nigeria.</p></div></div></footer><script src="js/data.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script><script src="js/components.js"></script><script src="js/seo.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const f=document.getElementById('search-form'),q=document.getElementById('q'),r=document.getElementById('results');const pages=[['About','University overview','about.html'],['Academics','Academic information','academics.html'],['Admissions','Admissions and application','admissions.html'],['How to Apply','Application guide','how-to-apply.html'],['Fees','Fees and payment information','fees.html'],['Contact','Contact and enquiry form','contact.html'],['Library','Library resources','library.html'],['Research','Research information','research.html'],['Campus Life','Student life and campus services','student-life.html'],['Scholarships','Scholarships','scholarships.html'],['FAQ','Frequently asked questions','faq.html']];function search(term){term=term.toLowerCase().trim();const out=[];pages.forEach(x=>{if((x[0]+' '+x[1]).toLowerCase().includes(term))out.push({type:'Page',title:x[0],url:x[2],excerpt:x[1]})});CUN_DATA.faculties.forEach(x=>{if((x.name+' '+x.description).toLowerCase().includes(term))out.push({type:'Faculty',title:x.name,url:`faculties.html#${x.id}`,excerpt:x.description})});CUN_DATA.departments.forEach(x=>{if(x.name.toLowerCase().includes(term))out.push({type:'Department',title:x.name,url:`departments.html#${x.id}`,excerpt:'Academic department'});});CUN_DATA.programmes.forEach(x=>{if((x.name+' '+x.overview+' '+x.careers).toLowerCase().includes(term))out.push({type:'Programme',title:x.name,url:`programme.html?id=${x.id}`,excerpt:x.overview})});CUN_DATA.news.forEach(x=>{if((x.title+' '+x.excerpt).toLowerCase().includes(term))out.push({type:'News',title:x.title,url:`news-detail.html?id=${x.id}`,excerpt:x.excerpt})});CUN_DATA.events.forEach(x=>{if((x.title+' '+x.description).toLowerCase().includes(term))out.push({type:'Event',title:x.title,url:`event-detail.html?id=${x.id}`,excerpt:x.description})});CUN_DATA.faqs.forEach(x=>{if((x.q+' '+x.a).toLowerCase().includes(term))out.push({type:'FAQ',title:x.q,url:'faq.html',excerpt:x.a})});r.innerHTML=`<p class="text-muted">${out.length} result${out.length===1?'':'s'}</p><div class="grid grid-2">${out.map(x=>`<article class="card"><div class="card-body"><span class="content-status">${sanitize(x.type)}</span><h2 class="mt-2" style="font-size:1.15rem"><a href="${sanitize(x.url)}">${sanitize(x.title)}</a></h2><p>${sanitize(x.excerpt||'')}</p></div></article>`).join('')}</div>`}f.addEventListener('submit',e=>{e.preventDefault();search(q.value);history.replaceState({},'',`search.html?q=${encodeURIComponent(q.value)}`)});const initial=new URLSearchParams(location.search).get('q');if(initial){q.value=initial;search(initial)}});</script></body></html>
