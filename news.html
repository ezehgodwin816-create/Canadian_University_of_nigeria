<body>

<header class="site-header"><div class="container header-inner">
    <a href="index.html" class="logo-link"><img src="https://www.cun.edu.ng/images/cun-logo.png" alt="CUN"></a>
    <nav class="main-nav"><a href="about.html" class="nav-link">About</a><a href="academics.html" class="nav-link">Academics</a><a href="admissions.html" class="nav-link">Admissions</a><a href="student-life.html" class="nav-link">Campus Life</a><a href="news.html" class="nav-link">News</a><a href="contact.html" class="nav-link">Contact</a></nav>

    <button class="menu-toggle" aria-label="Menu"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
  </div></header>
  <div class="mobile-menu"><div class="mobile-menu-panel"><div class="mobile-menu-header"><strong>Menu</strong><button class="mobile-menu-close btn btn-ghost">&times;</button></div>
  <nav class="mobile-nav"><a href="about.html">About</a><a href="academics.html">Academics</a><a href="admissions.html">Admissions</a><a href="student-life.html">Campus Life</a><a href="news.html">News</a><a href="contact.html">Contact</a><a href="login.html">Portals</a></nav></div></div>
  <main id="main"><div class="page-header"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a> <span>/</span> <span>News</span></div><h1>News</h1><p>University news — institutional articles.</p></div></div>
  <section class="section"><div class="container">
<div class="grid grid-3" id="news-list"></div>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("news-list").innerHTML=(window.CUN_DATA?.news||[]).map(n=>`
    <div class="card news-card"><img src="${n.image}" class="card-img" alt="" loading="lazy">
    <div class="card-body"><div class="news-meta">${n.category} · ${formatDate(n.date)}</div>
    <h3 class="card-title"><a href="news-detail.html?id=${n.id}">${n.title}</a></h3>
    <p class="card-text">${n.excerpt}</p></div></div>`).join("");
});
</script></div></section></main>
