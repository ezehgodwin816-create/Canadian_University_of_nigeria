<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News | Canadian University of Nigeria</title><meta name="description" content="CUN news, institutional updates and academic announcements."><meta property="og:title" content="News | Canadian University of Nigeria"><meta property="og:description" content="CUN news, institutional updates and academic announcements."><meta property="og:type" content="website"><meta property="og:url" content="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/news.html"><link rel="canonical" href="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/news.html"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a href="#main" class="skip-link">Skip to content</a><header class="site-header"><div class="container header-inner"><a href="index.html" class="logo-link"><img src="assets/logo.svg" alt="Canadian University of Nigeria"></a><nav class="main-nav"></nav><div class="header-actions"><button class="search-toggle" aria-label="Search">⌕</button><a href="login.html" class="btn btn-ghost btn-sm">Portals</a><a href="apply.html" class="btn btn-accent btn-sm">Apply Now</a><button class="menu-toggle" aria-label="Menu">☰</button></div></div></header><div class="mobile-menu"><div class="mobile-menu-panel"><div class="mobile-menu-header"><strong>Menu</strong><button class="mobile-menu-close btn btn-ghost">&times;</button></div><nav class="mobile-nav"></nav></div></div><main id="main"><div class="page-header"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>News</span></div><span class="section-label">News centre</span><h1>News & updates</h1><p>Institutional milestones and published university updates.</p></div></div><section class="section"><div class="container"><div class="filter-bar"><input id="news-q" class="form-control" type="search" placeholder="Search news"><select id="news-cat" class="form-control"><option value="">All categories</option></select></div><div class="grid grid-3" id="news-list"></div></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom"><p>© 2026 Canadian University of Nigeria.</p><div><a href="events.html">Events</a> · <a href="gallery.html">Gallery</a> · <a href="contact.html">Contact</a></div></div></div></footer><script src="js/data.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script><script src="js/components.js"></script><script src="js/seo.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const d=CUN_DATA.news||[],q=document.getElementById('news-q'),c=document.getElementById('news-cat'),list=document.getElementById('news-list');[...new Set(d.map(x=>x.category))].forEach(x=>c.insertAdjacentHTML('beforeend',`<option>${sanitize(x)}</option>`));function render(){const term=q.value.toLowerCase().trim(),cat=c.value;const rows=d.filter(n=>(!cat||n.category===cat)&&(!term||[n.title,n.excerpt,n.category].join(' ').toLowerCase().includes(term))).sort((a,b)=>new Date(b.date)-new Date(a.date));list.innerHTML=rows.map(n=>`<article class="card"><img src="${sanitize(n.image)}" class="card-img" alt="" loading="lazy"><div class="card-body"><span class="content-status">${sanitize(n.category)}</span><div class="news-meta mt-2">${formatDate(n.date)}</div><h2 class="card-title mt-2"><a href="news-detail.html?id=${encodeURIComponent(n.id)}">${sanitize(n.title)}</a></h2><p>${sanitize(n.excerpt)}</p><div class="text-muted" style="font-size:.82rem">Source: ${sanitize(n.source)}</div></div></article>`).join('')||'<div class="empty-state"><h3>No news matches your search</h3></div>'}q.oninput=render;c.onchange=render;render()});</script></body></html>
