<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQs | Canadian University of Nigeria</title><meta name="description" content="Frequently asked questions about CUN admissions, programmes, fees, portals and academics."><meta property="og:title" content="FAQs | Canadian University of Nigeria"><meta property="og:description" content="Frequently asked questions about CUN admissions, programmes, fees, portals and academics."><meta property="og:type" content="website"><meta property="og:url" content="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/faq.html"><link rel="canonical" href="https://ezehgodwin816-create.github.io/Canadian_University_of_nigeria/faq.html"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a href="#main" class="skip-link">Skip to content</a><header class="site-header"><div class="container header-inner"><a href="index.html" class="logo-link"><img src="assets/logo.svg" alt="Canadian University of Nigeria"></a><nav class="main-nav"></nav><div class="header-actions"><button class="search-toggle" aria-label="Search">⌕</button><a href="login.html" class="btn btn-ghost btn-sm">Portals</a><a href="apply.html" class="btn btn-accent btn-sm">Apply Now</a><button class="menu-toggle" aria-label="Menu">☰</button></div></div></header><div class="mobile-menu"><div class="mobile-menu-panel"><div class="mobile-menu-header"><strong>Menu</strong><button class="mobile-menu-close btn btn-ghost">&times;</button></div><nav class="mobile-nav"></nav></div></div><main id="main"><div class="page-header"><div class="container"><div class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>FAQs</span></div><span class="section-label">Help centre</span><h1>Frequently asked questions</h1><p>Search common questions about CUN.</p></div></div><section class="section"><div class="container"><input id="faq-search" class="form-control" type="search" placeholder="Search questions" aria-label="Search FAQs"><div id="faq-list" class="mt-4"></div></div></section></main><footer class="site-footer"><div class="container"><div class="footer-bottom"><p>© 2026 Canadian University of Nigeria.</p><div><a href="admissions.html">Admissions</a> · <a href="contact.html">Contact</a></div></div></div></footer><script src="js/data.js"></script><script src="js/config.js"></script><script src="js/app.js"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script><script src="js/components.js"></script><script src="js/seo.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const q=document.getElementById('faq-search'),list=document.getElementById('faq-list');function render(){const t=q.value.toLowerCase().trim();const rows=CUN_DATA.faqs.filter(f=>!t||[f.q,f.a,f.category].join(' ').toLowerCase().includes(t));list.innerHTML=rows.map(f=>`<details class="card mb-2" style="padding:1rem"><summary style="cursor:pointer;font-weight:700">${sanitize(f.q)}</summary><p class="mt-2">${sanitize(f.a)}</p><span class="content-status">${sanitize(f.category)}</span></details>`).join('')||'<div class="empty-state">No matching questions.</div>'}q.oninput=render;render()});</script></body></html>
