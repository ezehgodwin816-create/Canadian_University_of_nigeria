<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | Canadian University of Nigeria</title>
  <meta name="description" content="Student and staff portal login for Canadian University of Nigeria.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo-link" aria-label="CUN Home">
        <img src="assets/logo.svg" alt="Canadian University of Nigeria" height="40">
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">Home</a>
        <a href="apply.html" class="btn btn-accent btn-sm">Apply Now</a>
      </div>
    </div>
  </header>

  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <h1>Portal Login</h1>
      <p class="auth-sub">Sign in to the Student or Staff portal</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-portal="student" id="tab-student">Student</button>
        <button type="button" class="auth-tab" data-portal="staff" id="tab-staff">Staff</button>
      </div>

      <div class="auth-msg" id="auth-msg" role="status"></div>

      <form id="login-form" autocomplete="on">
        <input type="hidden" name="portal" id="portal-type" value="student">
        <div class="form-group">
          <label for="email">Email or Matric / Staff ID</label>
          <input type="text" id="email" name="email" class="form-control" required placeholder="you@example.com or ID" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;font-size:0.9rem">
          <label style="display:flex;align-items:center;gap:0.4rem;color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" name="remember" style="width:auto"> Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Sign in</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted)">
        Need help? <a href="contact.html">Contact support</a> ·
        <a href="staff-portal.html">Staff portal direct</a>
      </p>
    </div>
  </main>

  <script src="js/config.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script>
    (function(){
      const tabs = document.querySelectorAll('.auth-tab');
      const portalInput = document.getElementById('portal-type');
      const form = document.getElementById('login-form');
      const msg = document.getElementById('auth-msg');
      const btn = document.getElementById('login-btn');

      tabs.forEach(t => t.addEventListener('click', function(){
        tabs.forEach(x => x.classList.remove('active'));
        this.classList.add('active');
        portalInput.value = this.dataset.portal;
      }));

      function showMsg(text, isError){
        msg.textContent = text;
        msg.classList.add('show');
        msg.classList.toggle('error', !!isError);
      }

      form.addEventListener('submit', async function(e){
        e.preventDefault();
        if (!form.checkValidity()) return;
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        showMsg('Connecting securely…');
        try {
          const fd = new FormData(form);
          const portal = fd.get('portal') || 'student';
          if (typeof Auth !== 'undefined' && Auth.login) {
            const res = await Promise.race([
              Auth.login(fd.get('email'), fd.get('password'), portal),
              new Promise(r => setTimeout(() => r({success:false, message:'The login request is taking too long. Please refresh and try again.'}), 15000))
            ]);
            if (!res.success) {
              showMsg(res.message || 'Login failed.', true);
              btn.disabled = false;
              btn.textContent = 'Sign in';
              return;
            }
            showMsg('Login successful. Opening your portal…');
            setTimeout(() => {
              window.location.href = portal === 'staff' ? 'staff-portal.html' : 'student-portal.html';
            }, 600);
          } else {
            // Fallback demo behaviour when Auth is not loaded
            showMsg('Demo mode: redirecting to ' + portal + ' portal…');
            setTimeout(() => {
              window.location.href = portal === 'staff' ? 'staff-portal.html' : 'student-portal.html';
            }, 800);
          }
        } catch (err) {
          showMsg('Something went wrong. Please try again.', true);
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
