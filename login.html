<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CUN Demo Portals</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="demo-banner">DEMO LOGIN — Use the demo credentials below. Not connected to real accounts.</div>
  <main class="section flex-center" style="min-height:80vh">
    <div class="card" style="max-width:420px;width:100%;padding:2rem">
      <div class="text-center mb-4">
        <img src="assets/logo.svg" alt="CUN" style="height:48px;margin:0 auto 1rem">
        <h1 style="font-size:1.5rem">Portal Login</h1>
        <p class="text-muted">Demo authentication only</p>
      </div>
      <form id="login-form">
        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required placeholder="student@cun.demo"></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div class="mt-4" style="background:var(--gray-50);padding:1rem;border-radius:8px;font-size:0.85rem">
        <strong>Demo credentials:</strong><br>
        Student: student@cun.demo / student123<br>
        Staff: staff@cun.demo / staff123<br>
        Admin: admin@cun.demo / admin123
      </div>
      <p class="text-center mt-3"><a href="forgot-password.html">Forgot password?</a> · <a href="index.html">Home</a></p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.getElementById("login-form").onsubmit=e=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      const res=Auth.login(fd.get("email"), fd.get("password"));
      if(!res.success){Toast.error(res.message);return;}
      Toast.success("Login successful");
      const role=res.session.role;
      window.location.href = window.CUN_CONFIG.loginRedirect[role] || "index.html";
    };
  </script>
</body>
</html>
