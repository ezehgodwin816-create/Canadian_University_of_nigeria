<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | Canadian University of Nigeria</title>
  <meta name="description" content="Student and staff portal login for Canadian University of Nigeria.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo-link" aria-label="CUN Home">
        <img src="assets/logo.svg" alt="Canadian University of Nigeria" height="40">
      </a>
      <div class="header-actions">
        <a href="index.html" class="btn btn-ghost btn-sm">Home</a>
        <a href="apply.html" class="btn btn-accent btn-sm">Apply Now</a>
      </div>
    </div>
  </header>

  <main id="main" class="auth-wrap">
    <div class="auth-card">
      <h1>Portal Login</h1>
      <p class="auth-sub">Sign in with your CUN account</p>

      <div class="auth-msg" id="auth-msg" role="status"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;font-size:0.9rem">
          <label style="display:flex;align-items:center;gap:0.4rem;color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" name="remember" style="width:auto"> Remember me
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="login-btn">Sign in</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted)">
        Need help? <a href="contact.html">Contact support</a><br>
        <span style="display:inline-block;margin-top:0.5rem">
          <a href="student-portal.html">Student portal</a> ·
          <a href="staff-portal.html">Staff portal</a>
        </span>
      </p>
    </div>
  </main>

  <!-- CRITICAL: same load order as production — do not remove app.js -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var msg = document.getElementById('auth-msg');
      var btn = document.getElementById('login-btn');

      function showMsg(text, isError) {
        msg.textContent = text;
        msg.classList.add('show');
        msg.classList.toggle('error', !!isError);
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!form.checkValidity()) return;
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        showMsg('Connecting securely…');

        try {
          if (typeof Auth === 'undefined' || !Auth.login) {
            showMsg('Authentication module failed to load. Please refresh the page.', true);
            btn.disabled = false;
            btn.textContent = 'Sign in';
            return;
          }

          var email = form.email.value;
          var password = form.password.value;

          var res = await Promise.race([
            Auth.login(email, password),
            new Promise(function (resolve) {
              setTimeout(function () {
                resolve({ success: false, message: 'The login request is taking too long. Please refresh and try again.' });
              }, 20000);
            })
          ]);

          if (!res || !res.success) {
            showMsg((res && res.message) || 'Login failed.', true);
            btn.disabled = false;
            btn.textContent = 'Sign in';
            return;
          }

          showMsg('Login successful. Opening your portal…');

          // Use role returned by Auth (same as original workflow)
          var role = res.role || 'student';
          var redirects = (window.CUN_CONFIG && window.CUN_CONFIG.loginRedirect) || {
            student: 'student-portal.html',
            staff: 'staff-portal.html',
            admin: 'admin.html'
          };
          var target = redirects[role] || redirects.student || 'student-portal.html';

          setTimeout(function () {
            window.location.href = target;
          }, 500);
        } catch (err) {
          console.error(err);
          showMsg((err && err.message) || 'Something went wrong. Please try again.', true);
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
