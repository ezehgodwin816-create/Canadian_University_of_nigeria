<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CUN official Portals</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
<link rel="manifest" href="app-config/platform-manifest.json">
</head>
<body>
<main class="section flex-center" style="min-height:80vh">
    <div class="card" style="max-width:420px;width:100%;padding:2rem">
      <div class="text-center mb-4">
        <img src="assets/logo.svg" alt="CUN" style="height:48px;margin:0 auto 1rem">
        <h1 style="font-size:1.5rem">Portal Login</h1>
        <p class="text-muted">secure portal authentication</p>
      </div>
      <div id="auth-message" class="form-error mb-3" role="alert"></div><form id="login-form">
        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required placeholder="you@example.com"></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <div id="signup-panel" style="display:none" class="mt-4">
        <form id="signup-form">
          <div class="form-group"><label class="form-label">Full name</label><input class="form-control" name="fullName" required></div>
          <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
          <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" name="password" minlength="8" required></div>
          <button class="btn btn-accent btn-block" type="submit">Create applicant account</button>
        </form>
      </div>
      <p class="text-center mt-3"><button type="button" id="toggle-signup" class="btn btn-ghost btn-sm">Create applicant account</button> · <a href="forgot-password.html">Forgot password?</a> · <a href="index.html">Home</a></p>
    </div>
  </main>
  <script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}</script>
  <script src="js/data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260910"></script>
  <script src="js/app.js?v=20260908-login"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script>
  <script src="js/auth.js?v=20260908-login"></script>
  <script src="js/components.js?v=20260910"></script>
  <script>
    const msg=document.getElementById("auth-message");
    const showMsg=t=>{msg.textContent=t||"";};
    const redirectFor=role=>window.location.href=(window.CUN_CONFIG.loginRedirect[role]||"student-portal.html");
    document.getElementById("login-form").onsubmit=async e=>{
      e.preventDefault();
      const form=e.target, button=form.querySelector('button[type="submit"]');
      if(button?.disabled) return;
      if(!form.reportValidity()) return;
      button.disabled=true; button.textContent="Signing in…"; showMsg("Connecting securely…");
      try {
        const fd=new FormData(form);
        const res=await Promise.race([
          Auth.login(fd.get("email"),fd.get("password")),
          new Promise(resolve=>setTimeout(()=>resolve({success:false,message:"The login request is taking too long. Please refresh the page and try again."}),15000))
        ]);
        if(!res.success){showMsg(res.message); return;}
        showMsg("Login successful. Opening your portal…");
        redirectFor(res.role);
      } catch(err) {
        console.error(err);
        showMsg(err?.message || "Unable to sign in. Please try again.");
      } finally {
        button.disabled=false; button.textContent="Sign In";
      }
    };
    document.getElementById("toggle-signup").onclick=()=>{const p=document.getElementById("signup-panel");p.style.display=p.style.display==="none"?"block":"none";};
    document.getElementById("signup-form").onsubmit=async e=>{
      e.preventDefault(); showMsg("Creating account…");
      const fd=new FormData(e.target); const res=await Auth.signup(fd.get("email"),fd.get("password"),fd.get("fullName"));
      showMsg(res.success ? "Account created. Check your email if confirmation is required, then sign in." : res.message);
      if(res.success) e.target.reset();
    };
  </script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
