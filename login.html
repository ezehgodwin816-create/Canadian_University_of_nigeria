<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login | CUN Official Portals</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="app-config/platform-manifest.json">
</head>
<body>
<main class="section flex-center" style="min-height:80vh">
  <div class="card" style="max-width:420px;width:100%;padding:2rem">
    <div class="text-center mb-4">
      <img src="https://www.cun.edu.ng/images/cun-logo.png" alt="CUN" style="height:48px;margin:0 auto 1rem">
      <h1 style="font-size:1.5rem">Portal Login</h1>
      <p class="text-muted">Secure portal authentication</p>
    </div>

    <div id="auth-message" class="form-error mb-3" role="alert" aria-live="polite"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <div id="signup-panel" style="display:none" class="mt-4">
      <form id="signup-form" novalidate>
        <div class="form-group"><label class="form-label">Full name</label><input class="form-control" name="fullName" required autocomplete="name"></div>
        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required autocomplete="email"></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" name="password" minlength="8" required autocomplete="new-password"></div>
        <button class="btn btn-accent btn-block" type="submit">Create applicant account</button>
      </form>
    </div>

    <p class="text-center mt-3">
      <button type="button" id="toggle-signup" class="btn btn-ghost btn-sm">Create applicant account</button>
      · <a href="forgot-password.html">Forgot password?</a> · <a href="index.html">Home</a>
    </p>
  </div>
</main>

<script src="js/config.js?v=20260908-auth9"></script>
<script>
(function () {
  'use strict';

  const cfg = window.CUN_CONFIG || {};
  const msg = document.getElementById('auth-message');
  const loginForm = document.getElementById('login-form');
  const signupForm = document.getElementById('signup-form');
  const signupPanel = document.getElementById('signup-panel');
  const toggleSignup = document.getElementById('toggle-signup');

  function showMsg(text, ok) {
    msg.textContent = text || '';
    msg.style.display = text ? 'block' : 'none';
    msg.classList.toggle('form-success', !!ok);
    msg.classList.toggle('form-error', !ok);
  }

  function baseUrl() {
    return String(cfg.supabaseUrl || '').replace(/\/+$/, '');
  }

  function headers(accessToken) {
    const h = {
      'apikey': cfg.supabaseAnonKey,
      'Content-Type': 'application/json'
    };
    if (accessToken) h.Authorization = 'Bearer ' + accessToken;
    return h;
  }

  async function fetchJson(url, options, label) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(url, {...options, signal: controller.signal});
      let body = null;
      try { body = await response.json(); } catch (_) {}
      if (!response.ok) {
        const text = body?.msg || body?.message || body?.error_description || body?.error || ('HTTP ' + response.status);
        throw new Error(label + ': ' + text);
      }
      return body;
    } catch (err) {
      if (err?.name === 'AbortError') throw new Error(label + ': request timed out. Check your internet connection and Supabase project settings.');
      if (err instanceof TypeError) throw new Error(label + ': unable to reach the Supabase server. Check your internet connection, site hosting HTTPS, and Supabase URL.');
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  function saveSession(session) {
    if (!session) return;
    try {
      localStorage.setItem('cun_supabase_session', JSON.stringify(session));
      localStorage.setItem('cun_session', JSON.stringify(session));
    } catch (_) {}
  }

  async function signIn(email, password) {
    const data = await fetchJson(
      baseUrl() + '/auth/v1/token?grant_type=password',
      {method:'POST', headers:headers(), body:JSON.stringify({email:email.trim().toLowerCase(), password})},
      'Sign in'
    );
    if (!data?.access_token) throw new Error('Sign in: Supabase did not return an access token.');
    saveSession(data);
    return data;
  }

  async function signUp(email, password, fullName) {
    const data = await fetchJson(
      baseUrl() + '/auth/v1/signup',
      {method:'POST', headers:headers(), body:JSON.stringify({email:email.trim().toLowerCase(), password, data:{full_name:fullName.trim()}})},
      'Create applicant account'
    );
    if (data?.access_token) saveSession(data);
    return data;
  }

  async function profileFor(userId, accessToken) {
    const query = '?select=id,email,full_name,role,student_id,staff_id,phone,avatar_url&id=eq.' + encodeURIComponent(userId) + '&limit=1';
    try {
      const rows = await fetchJson(baseUrl() + '/rest/v1/profiles' + query, {method:'GET', headers:headers(accessToken)}, 'Load profile');
      return Array.isArray(rows) ? rows[0] : null;
    } catch (_) {
      // Authentication has already succeeded. A missing/blocked profile lookup must not make login appear to do nothing.
      return null;
    }
  }

  async function loginAndRedirect(email, password) {
    const session = await signIn(email, password);
    const user = session.user || {};
    const profile = user.id ? await profileFor(user.id, session.access_token) : null;
    const role = profile?.role === 'admin' ? 'admin' : profile?.role === 'staff' ? 'staff' : 'student';
    const redirects = cfg.loginRedirect || {};
    window.location.href = redirects[role] || 'student-portal.html';
  }

  if (!cfg.useSupabase || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    showMsg('Supabase is not configured in js/config.js.');
    return;
  }

  toggleSignup.addEventListener('click', function () {
    const opening = signupPanel.style.display === 'none';
    signupPanel.style.display = opening ? 'block' : 'none';
    toggleSignup.textContent = opening ? 'Hide applicant registration' : 'Create applicant account';
    showMsg('');
  });

  loginForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const button = loginForm.querySelector('button[type="submit"]');
    if (!loginForm.reportValidity() || button.disabled) return;
    const fd = new FormData(loginForm);
    button.disabled = true;
    button.textContent = 'Signing in…';
    showMsg('Connecting securely…');
    try {
      await loginAndRedirect(String(fd.get('email') || ''), String(fd.get('password') || ''));
    } catch (err) {
      console.error(err);
      showMsg(err?.message || 'Unable to sign in. Please try again.');
      button.disabled = false;
      button.textContent = 'Sign In';
    }
  });

  signupForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    const button = signupForm.querySelector('button[type="submit"]');
    if (!signupForm.reportValidity() || button.disabled) return;
    const fd = new FormData(signupForm);
    const fullName = String(fd.get('fullName') || '').trim();
    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '');
    button.disabled = true;
    button.textContent = 'Creating account…';
    showMsg('Creating your applicant account…');
    try {
      const data = await signUp(email, password, fullName);
      if (data?.access_token) {
        showMsg('Applicant account created. Opening the student portal…', true);
        window.location.href = (cfg.loginRedirect || {}).student || 'student-portal.html';
      } else {
        signupForm.reset();
        showMsg('Applicant account created successfully. Check your email to confirm the account, then sign in.', true);
      }
    } catch (err) {
      console.error(err);
      showMsg(err?.message || 'Unable to create the applicant account. Please try again.');
    } finally {
      button.disabled = false;
      button.textContent = 'Create applicant account';
    }
  });

  // Do not let an old CUN service worker make this auth page appear frozen.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
  }
})();
</script>
</body>
</html>
