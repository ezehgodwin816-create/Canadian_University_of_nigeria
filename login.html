<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CUN official Portals</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
<link rel="manifest" href="app-config/platform-manifest.json">
</head>
<body>
<main class="section flex-center" style="min-height:80vh">
    <div class="card" style="max-width:420px;width:100%;padding:2rem">
      <div class="text-center mb-4">
        <img src="https://www.cun.edu.ng/images/cun-logo.png" alt="CUN" style="height:48px;margin:0 auto 1rem">
        <h1 style="font-size:1.5rem">Portal Login</h1>
        <p class="text-muted">secure portal authentication</p>
      </div>
      <form id="login-form">
        <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required placeholder="student@cun.official"></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      
      <p class="text-center mt-3"><a href="forgot-password.html">Forgot password?</a> · <a href="index.html">Home</a></p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.getElementById("login-form").onsubmit=e=>{
      e.preventDefault();
      const fd=new FormData(e.target);
      const res=Auth.login(fd.get("email"), fd.get("password"));
      if(!res.success){Toast.error(res.message);return;}
      Toast.success("Login successful");
      const role=res.session.role;
      window.location.href = window.CUN_CONFIG.loginRedirect[role] || "index.html";
    };
  </script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
