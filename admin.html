<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | CUN official</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
<link rel="manifest" href="app-config/platform-manifest.json">
</head>
<body data-portal="admin">
<div class="portal-layout">
    <aside class="portal-sidebar" id="sidebar">
      <div class="portal-sidebar-header"><img src="https://www.cun.edu.ng/images/cun-logo.png" alt="CUN" style="height:36px"></div>
      <nav class="portal-nav">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Applications</a>
        <a href="#">Students</a>
        <a href="#">Programmes</a>
        <a href="#">News</a>
        <a href="#">Events</a>
        <a href="#">Settings</a>
        <a href="#" onclick="Auth.logout();return false">Logout</a>
      </nav>
    </aside>
    <div class="portal-main">
      <div class="portal-topbar">
        <button class="portal-mobile-toggle btn btn-ghost" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <strong>Admin</strong>
        <span id="admin-name">—</span>
      </div>
      <div class="portal-content">
        <div class="dash-cards">
          <div class="dash-card"><div class="dash-card-label">Applications</div><div class="dash-card-value" id="stat-applications">0</div></div>
          <div class="dash-card"><div class="dash-card-label">Students</div><div class="dash-card-value" id="stat-students">—</div></div>
          <div class="dash-card"><div class="dash-card-label">Programmes</div><div class="dash-card-value" id="stat-programmes">—</div></div>
          <div class="dash-card"><div class="dash-card-label">Pending</div><div class="dash-card-value" id="stat-pending">—</div></div>
        </div>
        <h2>Recent Applications</h2>
        <div class="table-wrap mt-2"><table>
          <thead><tr><th>App No.</th><th>Name</th><th>Programme</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="apps-tbody"></tbody>
        </table></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script><script src="js/services/platform.js"></script><script src="js/services/runtime.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/application.js"></script>
  <script src="js/components.js"></script>
  <script src="js/admin.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
