<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | CUN institutional</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-portal="student">
<div class="portal-layout">
    <aside class="portal-sidebar" id="sidebar">
      <div class="portal-sidebar-header"><img src="https://www.cun.edu.ng/images/cun-logo.png" alt="CUN" style="height:36px"></div>
      <nav class="portal-nav">
        <a href="#dash" class="active">Dashboard</a>
        <a href="#courses">Courses</a>
        <a href="#results">Results</a>
        <a href="#fees">Fees</a>
        <a href="#documents">Documents</a>
        <a href="#support">Support</a>
        <a href="#" onclick="Auth.logout();return false">Logout</a>
      </nav>
    </aside>
    <div class="portal-main">
      <div class="portal-topbar">
        <button class="portal-mobile-toggle btn btn-ghost" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <strong>Student Portal</strong>
        <span id="student-name">—</span>
      </div>
      <div class="portal-content">
        <div class="dash-cards">
          <div class="dash-card"><div class="dash-card-label">Student ID</div><div class="dash-card-value" style="font-size:1.2rem" id="student-id">—</div></div>
          <div class="dash-card"><div class="dash-card-label">Programme</div><div class="dash-card-value" style="font-size:1rem" id="student-programme">—</div></div>
          <div class="dash-card"><div class="dash-card-label">Level</div><div class="dash-card-value" id="student-level">—</div></div>
          <div class="dash-card"><div class="dash-card-label">CGPA</div><div class="dash-card-value">3.45</div></div>
        </div>
        <h2>Notifications</h2>
        <div id="notif-list"></div>
        <h2 class="mt-4">Quick Links</h2>
        <div class="grid grid-3 mt-2">
          <div class="card"><div class="card-body"><h4>Course Registration</h4><p class="text-muted">institutional module</p></div></div>
          <div class="card"><div class="card-body"><h4>Timetable</h4><p class="text-muted">institutional module</p></div></div>
          <div class="card"><div class="card-body"><h4>Fee Statement</h4><p class="text-muted">institutional module</p></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
