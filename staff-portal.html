<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal | CUN Demo</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-portal="staff">
  <div class="demo-banner">STAFF PORTAL DEMO</div>
  <div class="portal-layout">
    <aside class="portal-sidebar" id="sidebar">
      <div class="portal-sidebar-header"><img src="assets/logo.svg" alt="CUN" style="height:36px"></div>
      <nav class="portal-nav">
        <a href="#" class="active">Dashboard</a>
        <a href="#">My Courses</a>
        <a href="#">Class Lists</a>
        <a href="#">Results Entry</a>
        <a href="#">Attendance</a>
        <a href="#" onclick="Auth.logout();return false">Logout</a>
      </nav>
    </aside>
    <div class="portal-main">
      <div class="portal-topbar">
        <button class="portal-mobile-toggle btn btn-ghost" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <strong>Staff Portal</strong>
        <span id="staff-name">—</span>
      </div>
      <div class="portal-content">
        <div class="dash-cards">
          <div class="dash-card"><div class="dash-card-label">Department</div><div class="dash-card-value" style="font-size:1.1rem" id="staff-dept">—</div></div>
          <div class="dash-card"><div class="dash-card-label">Courses Assigned</div><div class="dash-card-value">3</div></div>
          <div class="dash-card"><div class="dash-card-label">Pending Results</div><div class="dash-card-value">12</div></div>
        </div>
        <h2>Assigned Courses (Demo)</h2>
        <div class="table-wrap mt-2"><table><thead><tr><th>Code</th><th>Title</th><th>Students</th></tr></thead>
        <tbody><tr><td>CSC201</td><td>Data Structures (Demo)</td><td>45</td></tr>
        <tr><td>CSC301</td><td>Algorithms (Demo)</td><td>38</td></tr></tbody></table></div>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
